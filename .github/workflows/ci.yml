name: CI

on:
  push:
    branches: [main, "feature/**", "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Unit and security tests with coverage
        run: |
          pytest tests/unit tests/security \
            --cov=salesforce_account_engagement_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Validate example configs
        run: |
          python -m json.tool examples/cursor-mcp.json >/dev/null
          python -m json.tool examples/claude-desktop-config.json >/dev/null
          python -m json.tool examples/gemini-mcp-config.json >/dev/null
          python -m json.tool examples/chatgpt-remote-mcp.json >/dev/null
          python scripts/health_check.py --offline

      - name: Pip audit
        run: |
          pip install pip-audit
          pip-audit --strict || pip-audit

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: salesforce-account-engagement-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
