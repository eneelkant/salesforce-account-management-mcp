[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-account-engagement-mcp"
version = "0.1.0"
description = "Production MCP server for Salesforce Marketing Cloud Account Engagement (Pardot) API v5"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Salesforce Account Engagement MCP Contributors" },
]
keywords = [
  "mcp",
  "salesforce",
  "account-engagement",
  "pardot",
  "marketing-cloud",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests>=2.32",
  "respx>=0.21",
]

[project.scripts]
salesforce-account-engagement-mcp = "salesforce_account_engagement_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/eneelkant/salesforce-account-management-mcp"
Documentation = "https://github.com/eneelkant/salesforce-account-management-mcp#readme"
Issues = "https://github.com/eneelkant/salesforce-account-management-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_account_engagement_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/scripts",
  "/README.md",
  "/AGENTS.md",
  "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: optional live sandbox tests (require RUN_AE_INTEGRATION=1)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["salesforce_account_engagement_mcp"]
omit = [
  "*/transports/*",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
  "S",
  "ASYNC",
  "RUF",
]
ignore = [
  "S101",
  "S105",
  "S106",
  "E501",
  "N815",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["salesforce_account_engagement_mcp"]
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
